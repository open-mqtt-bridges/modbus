[package]
name = "modbus-mqtt-bridge"
version = "1.0.3"
edition = "2024"
repository = "https://github.com/open-mqtt-bridges/modbus"
homepage = "https://open-mqtt-bridges.github.io/modbus/"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures = "0.3.34"
rumqttc = { version = "0.25.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9"
tokio = { version = "1.54.1", features = ["full"] }
tokio-modbus = "0.17.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
